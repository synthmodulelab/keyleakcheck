name: Release

# Publishing happens only here, from a version tag, never from a laptop.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish   # require manual approval in repo settings
    permissions:
      contents: write          # create the GitHub release
      id-token: write          # npm provenance and artifact attestation
      attestations: write
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # No registry-url: that would write an .npmrc expecting a token.
          # Publishing uses npm Trusted Publishing (OIDC) instead.

      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: npm new enough for Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm test

      - name: Build tarball and checksum
        run: |
          npm pack
          sha256sum keyleakcheck-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: keyleakcheck-*.tgz

      - name: Publish to npm with provenance (Trusted Publishing, no token)
        run: npm publish keyleakcheck-*.tgz --provenance --access public

      - name: Attach the tarball and checksum to the GitHub release
        # The release may already exist if the tag was created from the
        # GitHub "Draft a new release" page; then only attach the files.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" keyleakcheck-*.tgz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" keyleakcheck-*.tgz SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
